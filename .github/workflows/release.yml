name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish attested artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      PROVENANCE_ID: TT-GTNH-PROVENANCE-2025-04-29-E04BDE7
    steps:
      - name: Check out immutable tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate tag and release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Unsupported release tag: $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          if [[ "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-rc\.([0-9]+)$ ]]; then
            title="TeXTech ${BASH_REMATCH[1]} RC ${BASH_REMATCH[2]}"
          else
            title="TeXTech $version"
          fi
          if [[ "$tag" == *-* ]]; then
            prerelease=true
            make_latest=false
          else
            prerelease=false
            make_latest=true
          fi
          {
            echo "tag=$tag"
            echo "title=$title"
            echo "prerelease=$prerelease"
            echo "make_latest=$make_latest"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webae-frontend/package-lock.json
      - name: Build WebAE from the tag
        working-directory: webae-frontend
        run: |
          npm ci
          npm test -- --run
          npm exec tsc -- --noEmit
          npm run build:no-typecheck
      - name: Verify generated WebAE assets match the tag
        run: git diff --exit-code -- src/main/resources/assets/textech/webae
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build and test Java release
        run: ./gradlew --no-daemon spotlessCheck test build
      - name: Collect exact release assets
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          mkdir -p release
          expected=(
            "build/libs/textech-${tag}.jar"
            "build/libs/textech-${tag}-voice.jar"
            "build/libs/textech-${tag}-webae.zip"
            "build/libs/textech-${tag}-sources.jar"
          )
          for asset in "${expected[@]}"; do
            if [[ ! -s "$asset" ]]; then
              echo "Missing expected release asset: $asset" >&2
              find build/libs -maxdepth 1 -type f -printf '%f\n' | sort >&2
              exit 1
            fi
            cp "$asset" release/
          done
          if find release -maxdepth 1 -type f \( -iname '*dirty*' -o -iname '*dev*' -o -iname '*preshadow*' \) | grep -q .; then
            echo "A development artifact entered the release directory." >&2
            exit 1
          fi
          test "$(find release -maxdepth 1 -type f -name 'textech-*' | wc -l)" -eq 4
          (cd release && find . -maxdepth 1 -type f -name 'textech-*' -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS)
          jar tf "release/textech-${tag}.jar" | grep -Fx 'assets/textech/textures/promo/textech-icon-256.png'
          unzip -t "release/textech-${tag}-webae.zip"
      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          template=".github/release-notes/${tag}.md"
          if [[ -f "$template" ]]; then
            cp "$template" release/RELEASE_NOTES.md
          else
            printf '# TeXTech %s\n\nSee CHANGELOG.md for this release.\n' "${tag#v}" > release/RELEASE_NOTES.md
          fi
          sed -i \
            -e "s/@TAG@/$tag/g" \
            -e "s/@COMMIT_SHA@/$GITHUB_SHA/g" \
            -e "s/@PROVENANCE_ID@/$PROVENANCE_ID/g" \
            release/RELEASE_NOTES.md
      - name: Attest the four release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release/textech-*"
      - name: Upload release assets for audit
        uses: actions/upload-artifact@v7
        with:
          name: textech-${{ steps.meta.outputs.tag }}-release-assets
          path: |
            release/textech-*
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.meta.outputs.title }}
          body_path: release/RELEASE_NOTES.md
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          fail_on_unmatched_files: true
          files: |
            release/textech-*
            release/SHA256SUMS
