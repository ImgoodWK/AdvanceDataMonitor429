name: TeXTech CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run tests and build all artifacts
        run: ./gradlew --no-daemon spotlessCheck test build

  webae:
    name: WebAE
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webae-frontend/package-lock.json
      - name: Install exact dependencies
        working-directory: webae-frontend
        run: npm ci
      - name: Run Vitest
        working-directory: webae-frontend
        run: npm test -- --run
      - name: Check TypeScript
        working-directory: webae-frontend
        run: npm exec tsc -- --noEmit
      - name: Build production WebAE bundle
        working-directory: webae-frontend
        run: npm run build:no-typecheck
      - name: Verify committed WebAE bundle is reproducible
        run: git diff --exit-code -- src/main/resources/assets/textech/webae

  astrbot:
    name: AstrBot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run standard-library unit tests
        run: python -m unittest discover -s integrations/astrbot/tests -p "test_*.py"

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install document validators
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Check bilingual documentation contracts
        run: python tools/doc-check/doc-consistency-check.py
      - name: Validate JSON, YAML, CFF, links, and generated assets
        run: python tools/release/validate_repository.py
      - name: Test public provenance monitor policy
        run: python -m unittest tools.provenance.test_monitor
      - name: Scan tracked files for high-confidence secrets
        run: python tools/release/scan_secrets.py --tracked
