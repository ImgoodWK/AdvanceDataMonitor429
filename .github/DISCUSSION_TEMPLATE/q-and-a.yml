title: "[Q&A] "
labels: [question]
body:
  - type: markdown
    attributes:
      value: "Ask a usage or development question. Remove tokens, UUIDs, private addresses, and world data."
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TeXTech and GTNH versions
  - type: textarea
    id: attempts
    attributes:
      label: What have you tried?
