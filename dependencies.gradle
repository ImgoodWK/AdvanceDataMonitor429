/*
 * Add your dependencies here. Supported configurations:
 *  - api("group:name:version:classifier"): if you use the types from this dependency in the public API of this mod
 *       Available at runtime and compiletime for mods depending on this (and your) API
 *  - implementation("g:n:v:c"): if you need this for internal implementation details of the mod, but none of it is visible via the public API
 *       Available at runtime but not compiletime for mods depending on this mod
 *  - compileOnly("g:n:v:c"): if the mod you're building doesn't need this dependency during runtime at all, e.g. for optional mods
 *       Not available at all for mods depending on this mod, only visible at compiletime for this mod
 *  - compileOnlyApi("g:n:v:c"): like compileOnly, but also visible at compiletime for mods depending on this mod
 *       Available at compiletime but not runtime for mods depending on this mod
 *  - runtimeOnlyNonPublishable("g:n:v:c"): if you want to include a mod in this mod's runClient/runServer runs, but not publish it as a dependency
 *       Not available at all for mods depending on this (and your) API
 *  - devOnlyNonPublishable("g:n:v:c"): a combination of runtimeOnlyNonPublishable and compileOnly for dependencies present at both compiletime and runtime,
 *       but not published as Maven dependencies - useful for RFG-deobfuscated dependencies or local testing
 *  - runtimeOnly("g:n:v:c"): if you don't need this at compile time, but want it to be present at runtime
 *       Available at runtime for mods depending on this mod
 *  - annotationProcessor("g:n:v:c"): mostly for java compiler plugins, if you know you need this, use it, otherwise don't worry
 *  - testCONFIG("g:n:v:c") - replace CONFIG by one of the above (except api), same as above but for the test sources instead of main
 *
 *  - shadowImplementation("g:n:v:c"): effectively the same as API, but the dependency is included in your jar under a renamed package name
 *       Requires you to enable usesShadowedDependencies in gradle.properties
 *
 * For more details, see https://docs.gradle.org/8.0.1/userguide/java_library_plugin.html#sec:java_library_configurations_graph
 *
 * Target stack: GTNH pack 2.9.0-beta-2 (no older pack compatibility).
 * Version table: https://github.com/GTNewHorizons/GT-New-Horizons-Modpack/blob/2.9.0-beta-2/README.md
 */
dependencies {
    shadowImplementation('org.nanohttpd:nanohttpd:2.3.1')
    shadowImplementation('com.alphacephei:vosk:0.3.45')
    shadowImplementation('net.java.dev.jna:jna:5.14.0')
    // PinIn 传递依赖 fastutil；打入 it.unimi.dsi.fastutil 会与 gtnhlib 冲突。运行时由 gtnhlib 提供。
    // 使用 libs/ 本地 jar，避免部分国内 Maven 镜像无法解析 JitPack 坐标。
    shadowImplementation files('libs/PinIn-1.6.0.jar')

    // --- GTNH 2.9.0-beta-2 stack ---
    api('com.github.GTNewHorizons:GT5-Unofficial:5.09.54.20:dev')
    api('com.github.GTNewHorizons:StructureLib:1.4.42:dev')
    api('com.github.GTNewHorizons:Applied-Energistics-2-Unofficial:rv3-beta-1000-GTNH:dev')

    implementation('com.github.GTNewHorizons:AE2FluidCraft-Rework:1.5.95-gtnh:dev')
    implementation('com.github.GTNewHorizons:ArchitectureCraft:1.12.14:dev')
    implementation('com.github.GTNewHorizons:BlockRenderer6343:1.4.17:dev')
    implementation('com.github.GTNewHorizons:NewHorizonsCoreMod:2.9.5:dev')
    implementation('com.github.GTNewHorizons:Avaritia:1.97:dev')
    implementation('com.github.GTNewHorizons:Chisel:2.17.28-GTNH:dev')
    implementation('com.github.GTNewHorizons:Galacticraft:3.4.31-GTNH:dev')

    // 仍用 libs/：整合包 README 未单独列 Maven 坐标，或历史 deobf 产物
    implementation files('libs/IC2NuclearControl-2.7.8-dev.jar')

    compileOnly('thaumcraft:Thaumcraft:1.7.10-4.2.3.5:dev')
    // AE2 TileChest 编译期解析父类可选接口；用本地 stub（不引入 Curse 损坏 jar / 不装游戏模组）
    compileOnly files("$buildDir/ae2-optional-api-stubs.jar")

    // Dev-only runtime (not published)
    devOnlyNonPublishable('com.github.GTNewHorizons:NotEnoughItems:2.8.111-GTNH:dev')
    // JourneyMap — GTNH 2.9.0-beta-2 uses 5.2.19-fairplay; Modrinth Gradle id may lag — pin 5.2.18 until fairplay resolves
    devOnlyNonPublishable(rfg.deobf('maven.modrinth:journeymap:5.2.18'))
    // ModularUI2 / GTNHLib — GT5 5.09.54 + BQ 3.8.72 title API (setEffectTier)
    devOnlyNonPublishable('com.github.GTNewHorizons:ModularUI2:2.3.79-1.7.10:dev')
    devOnlyNonPublishable('com.github.GTNewHorizons:GTNHLib:0.11.24:dev')
    // GTNH-Web-Map (GWM / Dynmap fork) — WebAE Dynmap tiles
    devOnlyNonPublishable('com.github.GTNewHorizons:GTNH-Web-Map:0.4-beta-1:dev') {
        exclude group: 'com.github.GTNewHorizons', module: 'ModularUI2'
    }
    // BetterQuesting — WebAE quest book; reflection when present at runtime
    devOnlyNonPublishable('com.github.GTNewHorizons:BetterQuesting:3.8.72-GTNH:dev')
}
