/*
 * Add your dependencies here. Supported configurations:
 *  - api("group:name:version:classifier"): if you use the types from this dependency in the public API of this mod
 *       Available at runtime and compiletime for mods depending on this mod
 *  - implementation("g:n:v:c"): if you need this for internal implementation details of the mod, but none of it is visible via the public API
 *       Available at runtime but not compiletime for mods depending on this mod
 *  - compileOnly("g:n:v:c"): if the mod you're building doesn't need this dependency during runtime at all, e.g. for optional mods
 *       Not available at all for mods depending on this mod, only visible at compiletime for this mod
 *  - compileOnlyApi("g:n:v:c"): like compileOnly, but also visible at compiletime for mods depending on this mod
 *       Available at compiletime but not runtime for mods depending on this mod
 *  - runtimeOnlyNonPublishable("g:n:v:c"): if you want to include a mod in this mod's runClient/runServer runs, but not publish it as a dependency
 *       Not available at all for mods depending on this mod, only visible at runtime for this mod
 *  - devOnlyNonPublishable("g:n:v:c"): a combination of runtimeOnlyNonPublishable and compileOnly for dependencies present at both compiletime and runtime,
 *       but not published as Maven dependencies - useful for RFG-deobfuscated dependencies or local testing
 *  - runtimeOnly("g:n:v:c"): if you don't need this at compile time, but want it to be present at runtime
 *       Available at runtime for mods depending on this mod
 *  - annotationProcessor("g:n:v:c"): mostly for java compiler plugins, if you know you need this, use it, otherwise don't worry
 *  - testCONFIG("g:n:v:c") - replace CONFIG by one of the above (except api), same as above but for the test sources instead of main
 *
 *  - shadowImplementation("g:n:v:c"): effectively the same as API, but the dependency is included in your jar under a renamed package name
 *       Requires you to enable usesShadowedDependencies in gradle.properties
 *
 *  - compile("g:n:v:c"): deprecated, replace with "api" (works like the old "compile") or "implementation" (can be more efficient)
 *
 * You can exclude transitive dependencies (dependencies of the chosen dependency) by appending { transitive = false } if needed,
 * but use this sparingly as it can break using your mod as another mod's dependency if you're not careful.
 *
 * To depend on obfuscated jars you can use `devOnlyNonPublishable(rfg.deobf("dep:spec:1.2.3"))` to fetch an obfuscated jar from maven,
 * or `devOnlyNonPublishable(rfg.deobf(project.files("libs/my-mod-jar.jar")))` to use a file.
 *
 * Gradle names for some of the configuration can be misleading, compileOnlyApi and runtimeOnly both get published as dependencies in Maven, but compileOnly does not.
 * The buildscript adds runtimeOnlyNonPublishable to also have a runtime dependency that's not published.
 *
 * For more details, see https://docs.gradle.org/8.0.1/userguide/java_library_plugin.html#sec:java_library_configurations_graph
 */
dependencies {
    shadowImplementation('org.nanohttpd:nanohttpd:2.3.1')
    shadowImplementation('com.alphacephei:vosk:0.3.45')
    shadowImplementation('net.java.dev.jna:jna:5.14.0')
    // PinIn 传递依赖 fastutil；打入 it.unimi.dsi.fastutil 会与 gtnhlib 冲突。运行时由 gtnhlib 提供。
    // 使用 libs/ 本地 jar，避免部分国内 Maven 镜像无法解析 JitPack 坐标。
    shadowImplementation files('libs/PinIn-1.6.0.jar')
    devOnlyNonPublishable("com.github.GTNewHorizons:NotEnoughItems:2.5.4-GTNH:dev")
    implementation files('libs/Chisel-2.14.1-GTNH-dev.jar')
    implementation files('libs/Galacticraft-3.3.12-GTNH-dev.jar')
    implementation files('libs/IC2NuclearControl-2.7.8-dev.jar')
    //implementation files('libs/IC2NuclearControl-2.7.8-api.jar', 'libs/IC2NuclearControl-2.7.8-api.jar')
    //implementation files('libs/ArchitectureCraft-1.10.2-dev.jar', 'libs/ArchitectureCraft-1.10.2-dev.jar')
    //implementation files('libs/geckolib3-v3.0.0-dev.jar', 'libs/geckolib3-v3.0.0-dev.jar')
    api("com.github.GTNewHorizons:StructureLib:1.3.1:dev")
    devOnlyNonPublishable("com.github.GTNewHorizons:StructureLib:1.3.1:dev")
    api('com.github.GTNewHorizons:GT5-Unofficial:5.09.51.470:dev')
    devOnlyNonPublishable('com.github.GTNewHorizons:GT5-Unofficial:5.09.51.470:dev')
    implementation('com.github.GTNewHorizons:AE2FluidCraft-Rework:1.3.7-gtnh:dev')
    implementation('com.github.GTNewHorizons:ArchitectureCraft:1.10.2:dev')
    implementation('com.github.GTNewHorizons:BlockRenderer6343:1.3.16:dev')

    implementation('com.github.GTNewHorizons:NewHorizonsCoreMod:2.7.260:dev')
    implementation('com.github.GTNewHorizons:Avaritia:1.61:dev')
    //implementation('com.github.GTNewHorizons:Avaritiaddons:1.7.1-GTNH:dev')
    //implementation('com.github.GTNewHorizons:Eternal-Singularity:1.2.1:dev')
    //implementation('com.github.GTNewHorizons:Universal-Singularities:8.7.0:dev')
    //implementation('com.github.GTNewHorizons:Angelica:1.0.0-beta2:dev')
    compileOnly('thaumcraft:Thaumcraft:1.7.10-4.2.3.5:dev')

    // JourneyMap (GTNH 整合包同款 Modrinth 构建) — 仅 dev runClient/runServer，不发布给依赖方
    // 供 WebAE 世界地图快照从 JM 本地瓦片缓存读取地形；与 VisualProspecting / Navigator 对齐 5.2.18
    devOnlyNonPublishable(rfg.deobf('maven.modrinth:journeymap:5.2.18'))

    // GT5 5.09.51.470 依赖 UITexture.fullImage(mod, path, boolean)；2.3.x 已改为 ColorType API。
    // GTNHLib 0.11.9 需要 ModularUI2 2.3.x，与 GT5 5.09.51 不兼容；BetterQuesting 任务书 dev 用 0.10.7 + 2.2.18。
    devOnlyNonPublishable('com.github.GTNewHorizons:ModularUI2:2.2.18-1.7.10:dev')

    // GTNH-Web-Map (GWM / Dynmap fork) — 仅 dev 运行，不发布；供 WebAE 三源采集 Dynmap 地形与 dynmap/web/tiles 本地瓦片
    devOnlyNonPublishable('com.github.GTNewHorizons:GTNH-Web-Map:0.4-beta-1:dev') {
        exclude group: 'com.github.GTNewHorizons', module: 'ModularUI2'
    }

    // BetterQuesting (optional) — WebAE quest book; runtime via reflection when mod present.
    // GTNH fork ships bq_standard / questbook / cb4bq inside the same jar (see BetterQuesting mcmod.info).
    // Requires gtnhlib@[0.10.7,) at runtime; dev stack otherwise resolves 0.9.54 from GT5 — pin pack version.
    // Tag aligned with GTNH modpack 2.9.x (see GT-New-Horizons-Modpack README).
    devOnlyNonPublishable('com.github.GTNewHorizons:GTNHLib:0.10.7:dev')
    devOnlyNonPublishable('com.github.GTNewHorizons:BetterQuesting:3.8.70-GTNH:dev')

}
