// Additional dependency repositories for TeXTech.
//
// Official repositories are the reproducible default. Developers on domestic
// networks can opt in to Aliyun/Tencent mirrors with:
//   ./gradlew -Ptextech.useChinaMirrors=true <task>

def useChinaMirrors = providers.gradleProperty('textech.useChinaMirrors')
    .map { it.equalsIgnoreCase('true') }
    .orElse(false)
    .get()
def isCi = (System.getenv('CI') ?: '').equalsIgnoreCase('true')

repositories {
    if (useChinaMirrors) {
        maven {
            name = 'Aliyun Public'
            url = uri('https://maven.aliyun.com/repository/public')
        }
        maven {
            name = 'Aliyun Google'
            url = uri('https://maven.aliyun.com/repository/google')
        }
        maven {
            name = 'Tencent Maven Public'
            url = uri('https://mirrors.tencent.com/nexus/repository/maven-public/')
        }
    }

    mavenCentral()
    maven {
        name = 'GTNH Maven'
        url = uri('https://nexus.gtnewhorizons.com/repository/public/')
        content {
            includeGroupByRegex('com\\.github\\.GTNewHorizons(?:\\..+)?')
            includeGroupByRegex('com\\.gtnewhorizons(?:\\..+)?')
        }
    }
    maven {
        name = 'JitPack'
        url = uri('https://jitpack.io')
    }

    if (!isCi) {
        mavenLocal()
    }
}
